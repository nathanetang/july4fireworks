    position: relative;

    border: none;
    padding: 18px 48px;
    font-size: 20px;
    font-family: Georgia, serif;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(255,107,107,0.5);
    transition: transform 0.2s, box-shadow 0.2s;

    transform: scale(1.06);
    box-shadow: 0 0 50px rgba(255,180,50,0.7);
  }
  #no-btn {

    color: #aaa;
    border: 1px solid #444;
    padding: 18px 48px;
    font-size: 20px;
    font-family: Georgia, serif;
    border-radius: 50px;
    cursor: pointer;
    position: fixed;
    user-select: none;
  }

<body>
<div class="stars" id="stars"></div>

<div id="ask-screen">
  <h1>free <span>july 4th</span>?</h1>
  <div class="buttons">
    <button id="yes-btn" onclick="sayYes()">yes</button>
    <button id="no-btn" onclick="jumpNo()">no</button>
  </div>
</div>

<div id="fireworks-screen">
  <div id="bg-photo"></div>
  <canvas id="canvas"></canvas>
  <div class="emoji-burst">🎆 🧨 🎇</div>
  <h2>yay! see you then! 🎆</h2>
</div>

<script>
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${1.5+Math.random()*3}s;`;
    starsEl.appendChild(s);
  }

  const noBtn = document.getElementById('no-btn');
  let noClickCount = 0;

  window.addEventListener('load', () => {
    const yesBtn = document.getElementById('yes-btn');
    const rect = yesBtn.getBoundingClientRect();
    noBtn.style.left = rect.left + 'px';
    noBtn.style.top = (rect.bottom + 16) + 'px';
  });

  function jumpNo() {
    noClickCount++;
    const margin = 80, bw = 160, bh = 60;
    const x = margin + Math.random() * (window.innerWidth - bw - margin * 2);
    const y = margin + Math.random() * (window.innerHeight - bh - margin * 2);
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
    const newSize = Math.max(10, 20 - noClickCount * 0.5);
    noBtn.style.fontSize = newSize + 'px';
    noBtn.style.padding = `${Math.max(6, 18 - noClickCount)}px ${Math.max(16, 48 - noClickCount * 2)}px`;
  }

  function sayYes() {
    document.getElementById('ask-screen').style.display = 'none';
    noBtn.style.display = 'none';
    document.getElementById('fireworks-screen').classList.add('show');
    startFireworks();
  }

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  const COLORS = ['#ff6b6b','#ffb432','#ffd700','#ff69b4','#00cfff','#7fff00','#ff4500','#fff','#c084fc','#fb923c'];

  class Particle {
    constructor(x, y, color) {
      this.x = x; this.y = y; this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = 1.5 + Math.random() * 5;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.alpha = 1;
      this.decay = 0.012 + Math.random() * 0.015;
      this.radius = 2 + Math.random() * 2;
      this.gravity = 0.08;
      this.trail = [];
    }
    update() {
      this.trail.push({x:this.x,y:this.y,alpha:this.alpha});
      if (this.trail.length > 6) this.trail.shift();
      this.vx *= 0.98; this.vy *= 0.98; this.vy += this.gravity;
      this.x += this.vx; this.y += this.vy; this.alpha -= this.decay;
    }
    draw() {
      for (let i = 0; i < this.trail.length; i++) {
        const t = this.trail[i];
        ctx.beginPath();
        ctx.arc(t.x, t.y, this.radius * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = t.alpha * (i / this.trail.length) * 0.3;
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = this.alpha;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function explode(x, y) {
    const color = COLORS[Math.floor(Math.random() * COLORS.length)];
    for (let i = 0; i < 100 + Math.floor(Math.random()*60); i++)
      particles.push(new Particle(x, y, color));
  }

  function launchRandom() {
    explode(canvas.width*(0.2+Math.random()*0.6), canvas.height*(0.05+Math.random()*0.5));
  }

  let lastLaunch = 0;
  function animate(ts) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles = particles.filter(p => p.alpha > 0.01);
    particles.forEach(p => { p.update(); p.draw(); });
    if (ts - lastLaunch > 600) {
      launchRandom();
      if (Math.random() > 0.5) launchRandom();
      lastLaunch = ts;
    }
    requestAnimationFrame(animate);
  }

  function startFireworks() {
    for (let i = 0; i < 6; i++) setTimeout(launchRandom, i * 200);
    requestAnimationFrame(animate);
  }
</script>
</body>
</html>
